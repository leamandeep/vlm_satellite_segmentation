[theme]
primaryColor = "#2e6f40"
backgroundColor = "#f6f8f5"
secondaryBackgroundColor = "#e9efe6"
textColor = "#1c2b20"
linkColor = "#2e6f40"
borderColor = "#c4d3c6"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"

headingFontWeights = [600,500,500,500,500,500]
headingFontSizes = ["3rem", "2rem"]
