[theme.sidebar]
backgroundColor = "#edf2eb"
secondaryBackgroundColor = "#e2eae0"
headingFontSizes = ["1.6rem", "1.4rem", "1.2rem"]
dataframeHeaderBackgroundColor = "#d6e2d4"